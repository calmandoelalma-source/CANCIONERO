*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;padding-bottom:84px;min-height:100vh}

.lcard small{opacity:.95}

.ib{border:0;background:none;font-size:22px;padding:6px 8px;color:var(--mute);border-radius:10px}

.tag{display:inline-block;font-size:12px;background:var(--hl);color:#3b2f00;border-radius:8px;padding:2px 8px;margin-left:6px}

.muted{color:var(--mute)}

.prev{border:1px dashed var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;line-height:1.5;max-height:240px;overflow:auto;margin-top:10px}

.sw i.on{border-color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--card);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:760px;max-height:85vh;overflow:auto}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:15px;max-width:90vw}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.sec h3{margin:0 0 8px}
.note{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;max-height:140px;overflow:auto;font-size:15px;margin:8px 0}
</style>
</head>

ntos recuerdos de ti\n\n¡Ay, mi bien!, no te olvides del día\nQue separó a tu vida\nDe la pobre vida que me tocó vivir\n\n\nHay amores que se vuelven resistentes a los daños\nComo el vino que mejora con los años\nAsí crece lo que siento yo por ti\n\nHay amores que parece que se acaban y florecen\nY en las noches del otoño reverdecen\nTal como el amor que siento yo por ti\n\nYo por ti\nPor ti\nComo el amor que siento yo por ti","favorite":false,"sourceRecordId":"1699051756433","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1699051861151","title":"QUE ALGUIEN ME DIGA","lyrics":"Los días pasan y yo me siento\nSin darte un beso, como uno más\n\nCada mañana hago el intento\nPara olvidarte, pero ¡qué va!\n\n\nTu recuerdo me golpea aquí en el alma cada vez que me descuido\nComo un cazador furtivo, me persigue por toda esta soledad\nCuando creo que, por fin, ya te he olvidado y que voy a enamorarme\nAparece de la nada tu recuerdo y no soy nadie\n\n\nQue alguien me diga cómo se olvida\n¿Cómo se arranca para siempre un amor del corazón?\n\nQue alguien me ayude, se me hace urgente\nAndo buscando, entre la gente, quien me quite este dolor\n\nBusco alguien que me quiera por siempre\nQue me acepte en realidad como soy\nEse alguien que me dé su cariño\nLa que sea, venga a mí, por favor","favorite":false,"sourceRecordId":"1699051861151","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1699051921475","title":"NO ME ACOSTUMBRO","lyrics":"Mirando cosas viejas, hallé un poema\nEn una servilleta casi borrado\nEran solo unas líneas, era mi letra\nQue estaba dedicado a la mujer que amo\nLos versos eran tristes y malogrados\nPero eran un reflejo de aquellos años\nLos años más terribles que me han pasado\nY mientras los leía, me ahogaba el llanto\nNo me acostumbro, no\nNo me acostumbro\nTodavía al acostarme la recuerdo\nY al despertar, amor, tiemblo de miedo\nAl descubrir que solo estaba en mi sueño\nNo me acostumbro, no\nNo me acostumbro\nHice mil cosas para comenzar de nuevo\nDejé de frecuentar amigos en común\nPero me siento que estoy preso en aquel tiempo\nMirando cosas viejas, hallé una foto\nEn ella se veía besando mis ojos\nQuisiera ahora cerrarlos y sentir lo mismo\nDespués de tanto tiempo, hoy pido poco","favorite":false,"sourceRecordId":"1699051921475","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1699051982120","title":"MANANTIAL DE CORAZÓN","lyrics":"El suelo está cubierto de botellas\nDe ilusiones que rondaron con la noche\nEn la boca un sabor amargo me recuerda\n\nLas mentiras que dijimos en los cuentos\nQue creímos, me fumo un cigarrillo ya sin ganas\n\nMe miro en el espejo y veo a un hombre joven\nCuando en realidad me siento como de cien años\n\nY la noche no termina cuando el alba la ilumina\nY la noche no se acaba con el sol de la mañana\n\n\nMe tiro a la calle a caminar esta tristeza\nQuiero perderla entre la gente atravesando soledades\n\n\nPara dejar que corra libre un manantial de corazón\nVoy a dejar que corra libre un manantial de corazón\n\nAbriendo el canto mi voz se quiebra\nCruzando llanto contigo luna\nPara dejar que corra libre un manantial de corazón\nVoy a dejar que corra libre un manantial de corazón\nAbriendo el canto mi voz se quiebra\nCruzando llanto contigo luna\nAl celebrar brindaremos por ti","favorite":false,"sourceRecordId":"1699051982120","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1699052041504","title":"VOLVER","lyrics":"Yo adivino el parpadeo de las luces que a lo lejos\nVan marcando mi retorno\n\nSon las mismas que alumbraron con sus pálidos reflejos\nHondas horas de dolor\n\nY aunque no quise el regreso\nSiempre se vuelve al primer amor\n\nLa vieja calle donde le cobijo\nTuya es su vida, tuyo es su querer\n\nBajo el burlón mirar de las estrellas\nQue con indiferencia\nHoy me ven volver\n\n\nVolver\nCon la frente marchita\nLas nieves del tiempo platearon mi sien\nSentir\nQue es un soplo la vida\nQue veinte años no es nada\nQue febril la mirada\nErrante en las sombras, te busca y te nombra\nVivir\nCon el alma aferrada\nA un dulce recuerdo que lloro otra vez\n\n\n\n\nTengo miedo del encuentro con el pasado que vuelve\nA enfrentarse con mi vida\n\nTengo miedo de las noches que pobladas de recuerdos\nEncadenen mi soñar\n\nPero el viajero que huye\nTarde o temprano detiene su anda\n\nY aunque el olvido que todo destruye\nHaya matado mi vieja ilusión\n\nGuardo escondida una esperanza humilde\nQue es toda la fortuna de mi corazón","favorite":false,"sourceRecordId":"1699052041504","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1699052151032","title":"CARRO DE FUEGO","lyrics":"Fue como un carro de fuego, nuestro amor\nQue subiendo hacia los cielos, explotó\n\nUn sueño maravilloso, para dos\nDe esos que uno nunca quiere despertar\n\n\nY me quedé vacío\nCon una gran nostalgia\nSintiendo que no eras mía\nPobre corazón herido\n\n\nY me pregunto\nSi te di mi cariño a tiempo\nSi di el abrazo a tiempo\nSi mi palabra a tiempo\n\nHoy me pregunto\nSi este amor germinó en tu alma\nSi se lo llevó el viento\nO naufragó en el mar\n\n\nY me pregunto\nSi te di mi calor a tiempo\nSi di el abrazo a tiempo\nSi mi sonrisa a tiempo\n\nHoy me pregunto\nSi este amor germinó en tu alma\nSi se lo llevó el viento\nO naufragó en el mar","favorite":false,"sourceRecordId":"1699052151032","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1699052243762","title":"ESTA COBARDÍA","lyrics":"No se da ni cuenta que cuando la miro\nPor no delatarme me guardo un suspiro\nQue mi amor callado se enciende con verla\nQue diera la vida para poseerla\n\n\nNo se da ni cuenta que brillan mis ojos\nQue tiemblo a su lado y hasta me sonrojo\nQue ella es el motivo que a mi amor despierta\nQue ella es mi delirio y no se da cuenta\n\n\nEsta cobardía de mi amor por ella\nHace que la vea igual que a una estrella\nTan lejos, tan lejos en la inmensidad\nQue no espero nunca poderla alcanzar\n\n\n\nNo se  jamás, viviré al recordar, oh\n\n\nQué bonita fue esa noche\nMe trae recuerdos la noche\nBesando tu boquita de grana\nBella noche\nQué inolvidable esa noche\nQué romántica noche\nCuando besé tu boca de grana\nBella noche\n\n\nOtra, otra noche, otra\nAy, dame otra noche más\nOtra, otra noche, otra\nAy, parapapaparara\n\n___________________\n\nsta casa que yo hice\nPasando tanto trabajo\nTiene piso guayacán\nY paredes de chachajo\nEsta casa la hice yo\nCon amor y sacrificio\nPero el barrio está de fiesta, he invitado a mis amigos\n\nHoy, la vamos a tumba\nHoy, la vamos a tumba\nHoy, la vamos a tumba\nHoy, la vamos a tumba\n\nEsta noche me amanezco\nEsta noche bebo y bailo\nEsta noche estoy contento\nEsta noche me emborracho\n\nYa se está moviendo\nSe está aflojando\nYa se está hundiendo\nYa se está cayendo\n\n\nQue hoy la vamos a tumbar","favorite":false,"sourceRecordId":"1711240633888","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1711241139358","title":"LA GATA BAJO LA LLUVIA","lyrics":"Amor\nTranquilo, no te voy a molestar\nMi suerte estaba echada, ya lo sé\nY sé que hay un torrente dando vueltas por tu mente\n\nAmor\nLo nuestro solo fue casualidad\nLa misma hora, el mismo boulevard\nNo temas, no hay cuidado, no te culpo del pasado\n\nYa lo ves, la vida es así\nTú te vas y yo me quedo aquí\nLloverá, y ya no seré tuya\nSeré la gata bajo la lluvia\nY maullaré por ti\n\nAmor\nLo sé, no digas nada, de verdad\nSi ves alguna lágrima, perdón\nYa sé que no has querido hacer llorar a un gato herido\n\nAmor\nSi alguna vez nos vemos por ahí\nInvítame a un café y hazme el amor\nY si ya no vuelvo a verte ojalá que tengas suerte","favorite":false,"sourceRecordId":"1711241139358","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1711241232335","title":"CUANDO HABLAN LAS MIRADAS","lyrics":"Tomaré tu mano dulcemente\nTe hablaré de amor mientras bailamos\nCosas del ayer, nos decimos nada\n\nPorque ahora ha llegado la mirada\n\nTómame la mano suavemente\nDime que me amas mientras bailas\nBesos y caricias, sólo espero\nQuiero sentir tu respiración\n\nToma mi mano suave y dulcemente\nHazme sentir que nuestro amor existe\nQue en la realidad, lo entregas todo\nY que estás de mí realmente enamorada\n\n¿Por qué ahora la palabra no no dicen nada?\n\n\n¿Por qué ahora sólo hablan las miradas?\n\n\n¿Por qué ahora las palabras nos resbalan\n\n¿Por qué ahora nos encienden las miradas?","favorite":false,"sourceRecordId":"1711241232335","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1711241333147","title":"NO TENGO DINERO","lyrics":"Voy por la calle de la mano\nPlaticando con mi amor\nY voy recordando cosas serias\nQue me pueden suceder\n… Pues ya, me pregunta\nQue hasta cuándo nos iremos a casar\nY yo le contesto que soy pobre\nQue me tiene que esperar\n___________________\n\nNo vale la pena\nLo que tú me quieres\nPorque es muy poquito\nEso no me llena, no me es suficiente\nQuiero otro tantito\n\nNo vale la pena\nTus distantesitas\nCasi no te veo\nLa intención es buena, nadie te lo quita\nPero más yo quiero\n\n\nNo vale la pena date cuenta de eso que lo que tú me haz dado es una miseria son muy pocos besos para un enamorado","favorite":false,"sourceRecordId":"1711241333147","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1711241368934","title":"SIN SENTIMIENTOS","lyrics":"Sabías que te quería\nQue sin ti todo lo perdería\nNo lloro solo por llorar\nDiera la vida entera por reír\n\nQue fácil es decir que sí\nQue fácil te resultó decir que no\nSueño y me parece que estás\nDespierto y tú no me dejas en paz\n\nPorque vuelves a meterte en mi pensamiento\nA acabar con la poca fe que me queda para vivir\n\nEs que tú no sabes para qué sirven los sentimientos de otra persona\nTú no sabes eso\n¿Pa' qué sirve eso?\nTú no sabes querer\n\nSiempre diciendo que sí\nCon tu forma de ser diciéndome que no\nSé que hay una cara para mí\nSé que hay otra para los demás","favorite":false,"sourceRecordId":"1711241368934","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1718571109386","title":"Noches de Bocagrande","lyrics":"Noches de Bocagrande\nBajo la Luna plateada\nEl mar bordando luceros\nEn el filo de la playa\nEl mar bordando luceros\nEn el filo de la playa\n\nTú, reclinada en mi pecho\nAl vaivén de nuestra hamaca\nY yo contando mis besos\nEn tu boca, enamorada\nMas si la Luna nos mira\nEscondida tras las palmas\nTe juraré amor eterno\nAl vaivén de nuestra hamaca","favorite":false,"sourceRecordId":"1718571109386","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1718571358566","title":"MI VIEJO","lyrics":"Es un buen tipo mi viejo\nQue anda solo y esperando\nTiene la tristeza larga\nDe tanto venir andando\n\nYo lo miro de desde lejos\nPero somos tan distintos\nEs que creció con el siglo\nCon tranvía y vino tinto\n\nViejo, mi querido viejo\nAhora ya caminas lerdo\nComo perdonando el viento\nYo soy tu sangre, mi viejo\nSoy tu silencio y tu tiempo\n\n\n\nÉl tiene los ojos buenos\nY una figura pesada\nLa edad se le vino encima\nSin carnaval ni comparsa\n\nYo tengo los años nuevos\nMi padre los años viejos\nEl dolor lo lleva dentro\nY tiene historia sin tiempo","favorite":false,"sourceRecordId":"1718571358566","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1718571589657","title":"EL CARRETERO","lyrics":"Por el camino del sitio mío un carretero alegre paso\n\nEn su tonada que es muy sentida, y muy guajira alegre cantó.\n\nMe voy al transbordador a descargar la carreta\nMe voy al transbordador a descargar la carreta\nPara llegar a la meta de mi penosa labor.","favorite":false,"sourceRecordId":"1718571589657","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1718572365248","title":"EL CARRETERO","lyrics":"Por el camino del sitio mío un carretero alegre paso\n\nEn su tonada que es muy sentida, y muy guajira alegre cantó.\n\nMe voy al transbordador a descargar la carreta\nMe voy al transbordador a descargar la carreta\nPara llegar a la meta de mi penosa labor.\n\nYo trabajo sin reposo, para poderme casar, que\nYo trabajo sin reposo para poderme casar\nY si lo puedo lograr seré un guajiro dichoso.","favorite":false,"sourceRecordId":"1718572365248","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1718572498007","title":"EMBRUJO","lyrics":"No sé mi negrita linda\nQué es lo que tengo en el corazón\nQue ya no como ni duermo\nSi no pensando solo en tu amor\n\nHay muchos que me aconsejan\nQue te abandone que me haces mal\nY yo no sé lo que pasa\nQue cada día te quiero más\n\nY muchos dicen lo mismo\nQue tú me estás embrujando\nQue tu a mí me estás acabando\nQue yo ya no sirvo pa' na'\nQue ya no soy ni mi sombra\nQue me ven y no me conocen\nQue mi mal no tiene remedio\nQue ya yo me perdí","favorite":false,"sourceRecordId":"1718572498007","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1722707738603","title":"INGENUIDAD","lyrics":"Ingenuidad pensabas de mi cuando todo todo te di\nIngenuidad porque te crei, lo que quisiste yo fui\n\nfui tu cura fui tu remedio, como una pluma en el viento\nflotaba según tu aliento, según tu respiración\n\ndaba mi vida por ti y eso me hacia feliz\nporque todo lo que te daba era verdadero amor\n\n\nIngenuidad no era que yo creyera todo aquello que hiciste y dijiste\nIngenuidad era que tu mintieras tanto, porque a la vuelta perdiste\nIngenuidad no era que yo te amara y que te diera mi vida, sin medida\nIngenuidad era que tu pensaras que con falsas promesas me quedaria.\n\n\nSin preguntas todo te di, cada beso fue para ti,\nno habia duda en mi pensamiento, contigo iría hasta el fin\nmi cariño fue tan sincero, que me crei todo el juego\ny de eso no me arrepiento, mi corazón es asi\n\npero tu cambiaste las cosas, se marchitaron las rosas\ndejaste ver el engaño, y ahora lloras por mi\n\n\nIngenuidad no era que yo creyera todo aquello que hiciste y dijiste\nIngenuidad era que tu mintieras tanto porque a la vuelta perdiste\nIngenuidad no era que yo te amara y que te diera mi vida, sin medida\nIngenuidad era que tu pensaras que con falsas promesas me quedaría\n\n\nTe di mis manos como un niño\nque simplemente da cariño\nyo te entregue mis deseos, mis sueños y hasta mis miedos\n\nhaber creido que me amabas  no fue tan cruel como pensaba \n\ningenuidad fue mentirme, pues tu crueldad te castiga\nya nunca más regresaré\n\nyo sólo daba la verdad y tu mentiras\ntoda mi vida te entregué (y no supiste para que\nsiempre cumplí lo que juré (tu no cumplias)\ningenuidad no fue creer, tu engaño fue la ingenuidad","favorite":false,"sourceRecordId":"1722707738603","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1722707797230","title":"SIRENA ENCANTA","lyrics":"Yo sé bien que te voy a adorar toda la vida\nPorque tú me ayudaste a calmar mis sufrimientos\n\nEn mis sueños siempre vas a estar, mi reina linda\nEste amor nunca terminará, te lo prometo\n\n\nY tú llegaste cuando yo más te necesitaba\nSeñalando el camino menos doloroso\nMe brindaste lo más tierno que nace del alma\nDe tu vida me diste lo más puro y hermoso\n\n\nUn angelito del cielo me mima, me ama\nUna sirena encantada, me brinda sus besos\nTodo lo vuelve ternura, con una palabra\nComo por arte de magia, me lleva hasta el cielo\n\n\nSu vida es mi vida, su alma es mi alma\n\n\nComprendí que eras mi ángel guardián al conocerte\nTus encantos me hicieron soñar cuando sufría\n\nAhora siento que te quiero más, cambió mi suerte\nTodo el tiempo serás especial para mi vida\n\n\nY te prometo adorarte hasta el fin de mis días\nSi me diste el afecto que deseaba mi alma\nA tu lado todo se convierte en armonía\nTu borraste el pasado que me lastimaba\n\n\nUn angelito del cielo me mima, me ama\nUna sirena encantada me brinda sus besos\nTodo lo vuelve ternura con una palabra\nComo por arte de magia me lleva hasta el cielo\n\nSu vida es mi vida, su alma es mi alma","favorite":false,"sourceRecordId":"1722707797230","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1722707852882","title":"FUE UN PLACER CONOCERTE","lyrics":"Fue un placer conocerte y tenerte unos meses\nAunque esos meses fueron el principio y el fin\nDe un amor tan bonito, aunque no me quisiste\nPero yo sí te quise, y hoy me tengo que ir\n\nMuy feliz fui contigo, me conformé con nada\nY hoy te quedas sin mí\nA pesar de que nunca me dijiste te quiero\nY hoy que tengo irme me demuestras tu amor\n\nPero tengo que irme, porque ya no te quiero\nNo sé por qué motivo, cosas del corazón","favorite":false,"sourceRecordId":"1722707852882","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1722707889250","title":"CORAZÓN DE ACERO","lyrics":"Desde que tu me engañaste\nTengo el corazón de acero\nY de mis labios no sale\nDecirte ya que te quiero\n\nY aunque llores\nY te mueras de pena\nY te arrastres de dolor y de queja\nNo me apena, no me apena\n\nCorazón de acero tengo yo\nCulpa de tu amor que me engaño\nCorazón de acero tengo yo\nPorque tu amor me olvido\n\n\nTengo el pecho como piedra\nQue no le entran ni puñales\nY la culpa tu la tienes\nPor todas tu falsedades\n\nYa tu ves que no me importa que digan\nQue tu amor ya lo perdí\nQue es ajeno\nNo me apeno, no me apeno","favorite":false,"sourceRecordId":"1722707889250","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1722707940057","title":"SIMPLEMENTE AMIGOS","lyrics":"Siempre\nCómo ya es costumbre día a día es igual\nNo hay nada que decir\nAnte la gente es así\nAmigos simplemente amigos y nada más\n\nPero quien sabe en realidad\nLo que sucede entre los dos\nSi cada quién llegando la noche finge un adiós\n\nCuanto daría por gritarles nuestro amor\nDecirles que al cerrar la puerta nos amamos sin control\nQue despertamos abrazados\nCon ganas de seguir amándonos\nPero es que en realidad no aceptan nuestro amor\n\n\nSiempre (siempre)\nCon miradas siempre nos damos todo el amor\nHablamos sin hablar\nTodo es silencio en nuestro andar\nAmigos simplemente amigos y nada más","favorite":false,"sourceRecordId":"1722707940057","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1722707963123","title":"LA NOCHE MAS LINDA","lyrics":"Y yo llegué a tu casa temblando de miedo\nY te pedí el perdón que yo nunca concedo\nTe confesé que no conseguí reemplazarte\nY te dejé en tu alcoba después de besarte\n\nTus besos eran soles, mis manos puñales\nTu sonrisa y la mía se dijeron \"te quiero\"\nY brotaron las frases poco tradicionales\nEn una mujer libre y un hombre soltero\n\n… Y esa fue la noche más linda del mundo\nAunque nos durara tan solo un segundo\nQue no me arrepiento, porque aquel momento\nLo llevo grabado en mi pensamiento\n\n\n… Tu lecho en mi memoria, amigos ya viejos\nEl reloj de pared y la puerta de espejos\nNos vieron otra vez a los dos reflejados\nCometiendo uno a uno nuestros siete pecados\n\n… Me bebí de tu cuerpo la pálida savia\nCon una mezcla extraña de amor y de rabia\nPrimero nos amamos y luego lloramos\nY al final, por exceso de amor, nos separamos","favorite":false,"sourceRecordId":"1722707963123","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1722707983436","title":"HOY LO VI PASAR","lyrics":"Hoy lo vi pasar sin querer se\nApoderaron de mi antiguos\nSentimientos que yo pense que no\nExistian en mi que estaban mas que\nMuertos tanto tiempo\n\nHoy lo vi pasar senti algo extraño\nQue no puedo explicar a menos que\nLo quiera porque la sangre me\nQuemaba la piel corriendo por mis\nVenas que condena\n\nY recorde todos los buenos momentos\nQue vivi a su lado cuando a mi cielo\nLo lleno de estrellas con su huella\n\nY me olvide todo lo triste, lo malo\nQue paso conmigo que fue por el todo\nLo que he sufrido con su olvido\n\n\nHoy lo vi pasar me di cuenta que\nJamas lo olvide que todavia lo quiero\nQue esta en mi vida que no pude\nOlvidar y que no soy de acero y lo quiero","favorite":false,"sourceRecordId":"1722707983436","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1722708008284","title":"MAS QUE TU AMIGO","lyrics":"Quiero decirte\nEsta noche sin vacilación\nQue ya no aguanto\nLo que traigo aquí en mi corazón\n\nMe gustas tanto me enloqueces\nY no lo puedo ya ocultar\nEn todos lados me apareces\nComo ilusión en mi mirar\n\n\nEs un secreto\nQue tan sólo quiero compartir\n\nCon esos ojos\nQue le han dado luz a mi vivir\n\nQue en esta noche no hay más luna\nQue como tú me alumbre más\n\nQue en mi alma crece una fortuna\nPor tanta dicha que me das\n\n\nTe quiero\nTe quiero\nSe oye en mi pecho\nEs el grande amor que me has hecho","favorite":false,"sourceRecordId":"1722708008284","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1723583287433","title":"MAS QUE TU AMIGO","lyrics":"Quiero decirte\nEsta noche sin vacilación\nQue ya no aguanto\nLo que traigo aquí en mi corazón\n\nMe gustas tanto me enloqueces\nY no lo puedo ya ocultar\nEn todos lados me apareces\nComo ilusión en mi mirar\n\n\nEs un secreto\nQue tan sólo quiero compartir\n\nCon esos ojos\nQue le han dado luz a mi vivir\n\nQue en esta noche no hay más luna\nQue como tú me alumbre más\n\nQue en mi alma crece una fortuna\nPor tanta dicha que me das\n\n\nTe quiero\nTe quiero\nSe oye en mi pecho\nEs el grande amor que me has hecho","favorite":false,"sourceRecordId":"1723583287433","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1723845312359","title":"BUENAVENTURA SE QUEMA","lyrics":"Que tiene Buenaventura\nQué hay en su melancolía\nAncestro de mi negrura\nVaga, tristeza mía\nAncestro de mi negrura\n\nQue tiene ese extraño puerto\nQue embarga mi corazón\nCuando allá en el mar abierto\nEscucho un alegre son\nCuando allá en el mar abierto\nEscucho un alegre son\n\nBuenaventura se quema, ay agua, ay agua,\nNo hay agüita, agüita del mar ay se va, ay se va a quemar.\nBuenaventura se quema, ay agua, ay agua,\nNo hay agüita, agüita del mar ay se va, ay se va a quemar.\n\nY son también de la loma\nDe dónde serán también\nLos poetas y cantores\nQue le cantan al vaivén\nLos poetas y cantores\nQue le cantan al vaivén\n\nSon de las olas del mar\nSon del viento y las gaviotas\nSon de mi marea al andar\nSon de las cadenas rotas\nSon de mi marea al andar\nSon de mis cadenas rotas.\n\nBuenaventura se quema, ay agua, ay agua,\nNo hay agüita, agüita del mar ay se va, ay se va a quemar.\nBuenaventura se quema, ay agua, ay agua,\nNo hay agüita, agüita del mar ay se va, ay se va a quemar.\nSe quema, se quema\nSe quema, el puerto, se quema\nSe quema, se quema\nSe quema, el puerto, se quema\nSe quema, se quema\nSe quema, el puerto, se quema.","favorite":false,"sourceRecordId":"1723845312359","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1723845352127","title":"CABALLO VIEJO","lyrics":"Cuando el amor llega\nAsí de esta manera\nUno no se da ni cuenta\nEl carutal reverdece\nEl guamachito florece\nY la soga se revienta\n\nCaballo le dan sabana\nPorque está viejo y cansa'o\nPero no se dan ni cuenta\nQue un corazón amarra'o\nCuando le sueltan las riendas\nEs caballo desboca'o\n\n\nY si una potra alazana\nCaballo viejo se encuentra\nEl pecho se le desgrana\nNo le hace caso a falseta\nY no le obedece al freno\nNi lo paran falsas riendas\n\n\nCuando el amor llega\nAsí de esta manera\nUno no tiene la culpa\nQuererse no tiene horario\nNi fecha en el calendario\nCuando las ganas se juntan\n\nCaballo le dan sabana\nY tiene el tiempo conta'o\nY se va por la mañana\nCon su pasito apura'o\nA verse con su potranca\nQue lo tiene embarbasca'o\n\nEl potro da tiempo al tiempo\nPorque le sobra la edad\nCaballo viejo no puede\nPerder la flor que le dan\nPorque después de esta vida\nNo hay otra oportunidad","favorite":false,"sourceRecordId":"1723845352127","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1723845444424","title":"CENIZAS AL VIENTO","lyrics":"Yo me voy hasta el monte mañana\nYo me voy a cortar leña verde\nPara hacer una hoguera y en ell e amor ya no queda nada\nSolo una pobre canción\nDa vueltas por mi guitarra\nY hace rato que te extraña\nMi zamba para olvidar\n\n\n\nMi zamba vivió conmigo\nParte de mi soledad\nNo sé si ya lo sabrás\nMi vida se fue contigo\nContigo, mi amor, contigo\nQué mal me hace recordar\n\nMis manos ya son de barro\nTanto apretar al dolor\nY ahora que me falta el Sol\nNo sé qué venís buscando\nLlorando, mi amor, llorando\nTambién olvídame vos","favorite":false,"sourceRecordId":"1778363648492","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1779037714197","title":"Voy por la calle","lyrics":"Voy por la calle de la mano platicando con mi amor\nY voy recordando cosas serias que me pueden suceder\n\nPues ya me pregunta que hasta cuando nos iremos a casar\nY yo le contesto que soy pobre que me tiene que esperar\n\n\n\nNo tengo dinero ni nada que dar\nLo único que tengo es amor para amar\nSi así tú me quieres te puedo querer\nPero si no puedes ni modo que hacer\n\n\nYo sé que a mi lado tú te sientes pero mucho muy feliz\nY sé que al decirte que soy pobre no vuelves a sonreír\n\n\nQue va, yo quisiera tener todo y ponerlo a tus pies\nPero yo nací pobre y es por eso que no me puedes querer","favorite":false,"sourceRecordId":"1779037714197","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1784408015301","title":"LA CUMBIA DEL AMOR","lyrics":"Se oye en la lejanía tambor\nSe oye esta voz de cumbia, cumbia\nParece cumbia mía, mía\n\nLa cumbia del amor\nLa cumbia del amor\nLa cumbia del amor\nLa cumbia del amor\n\nPorque se oye\nEl din—dun de tu corazón\nY el mío, porque ellos se unen\nCuando cantan, cuando están contentos, cuando tienen frío\n\nLa cumbia del amor\nLa cumbia del amor\nLa cumbia del amor\nLa cumbia del amor\n\n\nCuando la brisa sopla, siento\nEl tambor más cerquita, cumbia\nParece cumbia mía, mía\n\nLa cumbia del amor\nLa cumbia del amor\nLa cumbia del amor\nLa cumbia del amor\n\nPorque se oye\nEl din—dun de tu corazón\nY el mío, porque ellos se unen\nCuando cantan, cuando están contentos, cuando tienen frío\n\nLa cumbia del amor\nLa cumbia del amor\nLa cumbia del amor\nLa cumbia del amor","favorite":false,"sourceRecordId":"1784408015301","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1733615339128","title":"LOS SABANALES","lyrics":"Cuando llegan las horas de la tarde\nQue me encuentro tan solo y muy lejos de ti...\nMe provoca volve' a los guayabales\nDe aquellos sabanales donde te conocí...\n\nMis recuerdos son aquellos paisajes\nY los estoy pintando exactos como son...\nYa pinté aquel árbol del patio\nQue es donde tú reposas cuando calienta el sol\n\nVivo aquí...\nPintando el paisaje sabanero\nPorque allí...\nEs donde están todos mis recuerdos\n\nVení..., corazón vení\nVení... más cerca de mí\n\n\nVen a consolarme, ven acompañarme, ven ven a besarme\nComo aquella tarde\nVen a consolarme, ven acompañarme, ven ven a besarme\nComo aquella tarde que estuve allá\nComo aquella tarde que me besó\nComo al día siguiente que amaneció\nBésame como tu sabes besar\nComo al día siguiente que amaneció\nBésame como tu sabes besar","favorite":false,"sourceRecordId":"1733615339128","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1733616424340","title":"GOLPE CON GOLPE","lyrics":"Hicimos una vez\nUn pacto sagrado que además firmamos\nY luego juramos nunca disolver\n\nQue tú eras para mí\nQue yo era para ti\nLos dos para las buenas\nLos dos pa' las malas por siempre hasta el fin\n\nA ti se te olvidó\nMataste aquel amor tan dulce como miel\nTan puro como el agua de mi manantial\n\nPor eso es que me voy\nY no me da dolor que sepas que otro amor\nEs dueño del cariño que una vez te di\n\nY por eso golpe con golpe yo pago\nBeso con beso devuelvo\nEsa es la ley del amor que yo aprendí que yo aprendí\n\nGolpe con golpe yo pago\nBeso con beso devuelvo\nEsa es la ley del amor que yo aprendí que yo aprendí","favorite":false,"sourceRecordId":"1733616424340","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1733618269512","title":"POCO A POCO","lyrics":"Poco, poco a poco me has querido,\n\nPoco a poco me has amado,\n\nAl final todo ha cambiado\n\nLas cositas de mi amor.\n\nPoco, poco a poco me has querido,\n\nPoco a poco me has amado,\n\nAl final todo ha cambiado\n\nLas cositas de mi amor\n\nNunca digas que no, vidita\n\nNunca digas jamás, negrita.\n\nSon cosas del amor, vidita\n\nCosas del corazón.\n\nCanción y huayno para cantar,\n\nCanción y cumbia para bailar","favorite":false,"sourceRecordId":"1733618269512","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1739051764100","title":"MAS QUE TU AMIGO","lyrics":"Quiero decirte\nEsta noche sin vacilación\nQue ya no aguanto\nLo que traigo aquí en mi corazón\n\nMe gustas tanto me enloqueces\nY no lo puedo ya ocultar\nEn todos lados me apareces\nComo ilusión en mi mirar\n\n\nEs un secreto\nQue tan sólo quiero compartir\n\nCon esos ojos\nQue le han dado luz a mi vivir\n\nQue en esta noche no hay más luna\nQue como tú me alumbre más\n\nQue en mi alma crece una fortuna\nPor tanta dicha que me das\n\n\nTe quiero\nTe quiero\nSe oye en mi pecho\nEs el grande amor que me has hecho","favorite":false,"sourceRecordId":"1739051764100","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1741388314168","title":"NUESTRO JURAMENTO","lyrics":"No puedo verte triste porque me mata\nTu carita de pena, mi dulce amor\nMe duele tanto el llanto que tu derramas\nQue se llena de angustia mi corazón\n\nYo sufro lo indecible si tu entristeces\nNo quiero que la duda te haga llorar\nHemos jurado amarnos hasta la muerte\nY si los muertos aman\nDespués de muertos amarnos mas\n\n\nSi yo muero primero, es tu promesa\nSobre de mi cadáver dejar caer\nTodo el llanto que brote de tu tristeza\nY que todos se enteren de tu querer\n\nSi tú mueres primero, yo te prometo\nEscribiré la historia de nuestro amor\nCon toda el alma llena de sentimiento\nLa escribiré con sangre\nCon tinta razón\nGotas de lluvia, no es el rocío\nLágrimas que brotan porque ya no hay amor\n\n\nQuisiera saber, saber por qué se escapó\nDe mis brazos toda la felicidad\nA toda máquina corriendo voló\nNo dejo huella, se desapareció\nNo le importó que yo sintiera temor\nDe verme solo así, llorando de amor\nY por su mente pienso que no pasó\nQue por su culpa yo sintiera dolor\n\n\n\nVerano azul que me calentó otoño gris que con el frío llegó \n\n\nPoco a poco me fui quedando sin respiración\nSin una explicación\nMucho te quise, tal vez\nY el mundo me quedó al revés\nYa no quiero vivir\nSin ti, para qué existir","favorite":false,"sourceRecordId":"1743285762502","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1761778749157","title":"COMO ME COMPONGO YO","lyrics":"¿Cómo me compongo yo en el día de hoy?\n\n¿Cómo me compongo yo en el de mañana?\n\n¿Cómo me compongo yo en el día de hoy?\n\n¿Cómo me compongo yo en el de mañana?\n\n¿Cómo me compongo yo si vivo triste?\n\n¿Cómo me compongo yo? me duele el alma\n\n¿Cómo me compongo yo si vivo triste?\n\n¿Cómo me compongo yo? me duele el alma\n\nYo quiero pegar un grito y no me dejan\n\nYo quiero pegar un grito vagabundo\n\nYo quiero pegar un grito y no me dejan\n\nYo quiero pegar un grito vagabundo\n\nYo quiero decirte adiós, adiós mi vida\n\nYo quiero decirte adiós, desde este mundo\n\nYo quiero decirte adiós, adiós mi vida\n\nYo quiero decirte adiós desde este mundo","favorite":false,"sourceRecordId":"1761778749157","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1756662947594","title":"REMINISCENCIAS","lyrics":"Amada, es imposible borrar de mi memoria\nMe persigue el recuerdo de tu extraño mirar\n\nEsa risa tan tuya, tus labios tentadores\nQue dejaron su encanto prendido en mi ansiedad\n\n\nEn mi alma vagabunda se fundió el alma tuya\nComo el llano se funde cuando lo besa el sol\n\nPor eso aunque otros labios me dieron su ternura\nNinguno como el tuyo llegó a mi corazón\n\n\n\nFueron los ojos tonta me ha dejado en suspenso,\nMe ha abrumado: \"No es como yo la pienso\".\nEl sentimiento era demasiado intenso,\nY me he quedado.\n\nNo sé.\nNo sé quién eres.\nNo sé qué serás.\nNo sé qué será de nosotros.\nLo aprenderemos sólo viviendo.\n\nTemo por eso esta ternura,\nAhora que nuestra aventura\nEs una historia ya verdadera,\n¡deseo tanto que seas sincera!\n\nEn esta tienda que contiene tantas cosas,\nY unas son negras, otras verdes, otras rosas,\nDebo elegir la que conviene a mi destino:\nNo sé el camino.\n\nHe regresado con mi compra hasta mi casa\nY tengo miedo de romper la cinta rosa,\nQue no es lo mismo equivocarse en una cosa\nQue en una esposa.\n\nNo sé,\nNo sé quién eres.\nNo sé qué serás.\nNo sé qué será de nosotros.\nLo aprenderemos sólo viviendo.\n\nTemo por eso esta ternura.\nAhora que nuestra aventura es una historia ya verdadera,\n¡deseo tanto que seas sincera!","favorite":false,"sourceRecordId":"1758423985488","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1767137383863","title":"MAS QUE TU AMIGO","lyrics":"Quiero decirte\nEsta noche sin vacilación\nQue ya no aguanto\nLo que traigo aquí en mi corazón\n\nMe gustas tanto, me enloqueces\nY no lo puedo ya ocultar\nEn todos lados te apareces\nComo ilusión en mi mirar\n\nEs un secreto\nQue tan solo quiero compartir\nCon esos ojos\nQue le han dado luz a mi vivir\n\nY en esta noche no hay más luna\nQue como tú me alumbre más\nQue en mi alma crece una fortuna\nPor tanta dicha que me das\n\nTe quiero, te quiero\nSe oye en mi pecho\nEs el grande amor, que me has hecho\nLatido a latido\nTe siento conmigo\nYo quiero ser más que tu amigo\n\n\nEs un secreto\nQue tan solo quiero compartir\nCon esos ojos\nQue le han dado luz a mi vivir\n\n\nY en esta noche no hay más luna\nQue como tú me alumbre más\nQue en mi alma crece una fortuna\nPor tanta dicha que me das","favorite":false,"sourceRecordId":"1767137383863","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1767137961701","title":"PEDACITO DE MI VIDA","lyrics":"No puede vivir sin ti\nmi angustiado corazón\n\nToditas las noches cariñito\nme la paso en vela mi amor\nen ti pensando y por ti sufriendo\n\nVuelve pedacito de mi vida\nyo te lo suplico por Dios,\nno hagas desdichado a mi corazón.\n\nQue vacío hay en mi alma\nque amargura en mi exsitir\nSiento que me haces falta\nyo no se sin ti vivir\n\nToditas las noches cariñito\nme la paso en vela mi amor\nen ti pensando y por ti sufriendo\nVuelve pedacito de mi vida\nyo te lo suplico por Dios,\nno hagas desdichado a mi corazón","favorite":false,"sourceRecordId":"1767137961701","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1772381150806","title":"MI VIEJO PIERO","lyrics":"Es un buen tipo mi viejo\nQue anda solo y esperando\nTiene la tristeza larga\nDe tanto venir andando\n\nYo lo miro de desde lejos\nPero somos tan distintos\nEs que creció con el siglo\nCon tranvía y vino tinto\n\nViejo, mi querido viejo\nAhora ya caminas lerdo\nComo perdonando el viento\nYo soy tu sangre, mi viejo\nSoy tu silencio y tu tiempo\n\n\nÉl tiene los ojos buenos\nY una figura pesada\nLa edad se le vino encima\nSin carnaval ni comparsa\n\nYo tengo los años nuevos\nMi padre los años viejos\nEl dolor lo lleva dentro\nY tiene historia sin tiempo","favorite":false,"sourceRecordId":"1772381150806","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1772381197719","title":"LOS VERSOS A MI MADRE","lyrics":"Mi madre es un poema\nDe blanca cabellera\nQue tiene a flor de labios\nUn gesto de perdón\nCuando tras larga ausencia regreso\nElla me espera\nMe abraza como a un niño\nMe besa con pasión\n\nMi madre es pequeñita\nIgual que una violeta\nLo dulce esta en su alma\nEl llanto en el adiós\n\nEs dueña de mis sueños\nAunque no soy poeta\nLos versos a mi madre\nMe los inspira Dios\n\n\nQué linda que es mi madre\nQué suerte es tenerla\nY que dichoso al verla\nFeliz en el hogar \n\n\nMi madre es como un cromo\nDe mágica paleta\nCanción, dolor, ternura\nDe todo hay en su voz\n\n\nEs dueña de mis sueños\nAunque no soy poeta\nLos versos a mi madre\nMe los inspira Dios","favorite":false,"sourceRecordId":"1772381197719","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1772381235357","title":"MADRECITA IDEAL","lyrics":"Escucha mi canción de amor\nBien sabes tu que es para ti\nLa hice con la devoción\nQue es para mi una oración\n\nMadrecita tu nombre es Dios\nAbnegación luz y calor\nFelicidad, adoración\nLa reina del hogar\n\n\nSiempre tejiste con sonrisas\nLos amargos ratos y horas de dolor\nY ocultaste con valor\nAquellas lágrimas de amor\n\nDiste la sangre para que en mis venas\nYo tuviera siempre tu calor\nTu nombre evoco madrecita ideal\nTu nombre evoco madrecita ideal\n\n\nTu vida es mi inspiración\nAsí viví con ilusión\nViejita de mi ensoñación\nEres mi fe, eres mi sol\nQuiero tenerte junto a mi\nPara vivir feliz los dos\nPara cantar y en ti confiar\nMis cuitas y dolor","favorite":false,"sourceRecordId":"1772381235357","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1773610735345","title":"El Camino De la vida","lyrics":"De prisa, como el viento, van pasando\nLos días y las noches de la infancia\nUn ángel nos depara sus cuidados\nMientras sus manos tejen las distancias\n\nDespués llegan los años juveniles\nLos juegos, los amigos, el colegio\nEl alma ya define sus perfiles\nY empieza el corazón de pronto a cultivar un sueño\n\n\nY brotan como un manantial\nLas mieles del primer amor\nEl alma ya quiere volar\nY vuela tras una ilusión\nY aprendemos que el dolor y la alegría\nSon la esencia permanente de la vida\n\nY luego, cuando somos dos\nLuchando por un ideal\nFormamos un nido de amor\nRefugio que se llama \"hogar\"\nY empezamos otra etapa del camino\nUn hombre, una mujer\nUnidos por la fe y la esperanza\n\n\nLos frutos de la unión que Dios bendijo\nAlegran el hogar con su presencia\nA quien se quiere más, si no a los hijos\nSon la prolongación de la existencia\n\nDespués cuántos esfuerzos y desvelos\nPara que no les falte nunca nada\nPara que cuando crezcan lleguen lejos\nY puedan alcanzar esa felicidad tan anhelada\n\n\nY brotan como un manantial\nLas mieles del primer amor\nSus almas ya quieren volar\nY vuelan tras una ilusión\nY descubren que el dolor y la alegría\nSon la esencia permanente de la vida\n\nMas luego cuando ellos se van\nAlgunos sin decir adiós\nEl frío de la soledad\nGolpea nuestro corazón\n\nEs por eso, amor mío que te pido\nComo le pido a Dios\nSi llego a la vejez, que estés conmigo","favorite":false,"sourceRecordId":"1773610735345","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1773610768115","title":"EN TU PELO","lyrics":"En tu pelo tengo yo el cielo\nEn tus brazos el calor del sol\nEn tus ojos tengo luz de luna\nY en tus lágrimas sabor de mar\n\nEn tu boca hay un panal de mieles\nY en tu aliento escucho ya tu voz\nPor tus ojos y tu boca, por tus brazos y tu pelo\nPor tus lágrimas y voz me muero\n\nTú eres todo lo que anhelé\nY yo por eso me enamoré\nSiento campanitas\nMuy adentro del corazón","favorite":false,"sourceRecordId":"1773610768115","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1773610919228","title":"SABRAS","lyrics":"Quiero que sepas que mi corazón\nEn toda situación te va a querer\nQue cuando te miro siento el amor\nMás grande que puede haber en mi ser\n\n\nQuiero que sepas que quererte a ti\nMe nace de forma muy natural\nQue tu existencia es lo mejor que a mí\nEn esta vida me pudo pasar\n\n\nY aunque me esté quedando sordo\nY aunque me esté quedando ciego\nY aunque me esté quedando mudo\nTe haré saber que te quiero\nAunque yo ya me encuentre viejo\nAunque esté triste o contento\nTe haré saber de cualquier modo\nQue estarás en mis adentros\n\n\nCuando amanece y te puedo ver\nMi vida se llena de luz total\nSiento que quiero a los niños y así\nMido mi gran capacidad de amar\n\nCuando te beso es tanta la emoción\nQue el corazón palpita más y más\nEntro a un estado de relajación\nSiento que ya puedo morir en paz","favorite":false,"sourceRecordId":"1773610919228","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1774045220770","title":"MADRIGAL","lyrics":"Estando contigo me olvido de todo y de mí\nParece que todo lo tengo teniéndote a ti\n\nY no siento este mal que me agobia y que llevo conmigo\nArruinando esta vida que tengo y no puedo vivir\n\nEres luz que ilumina las noches en mi largo camino\nY es por eso que frente al destino no quiero vivir\n\n\nUna rosa en tu pelo parece una estrella en el cielo\nY en el viento parece un acento tu voz musical\nY parece un destello de luz la medalla en tu cuello\nAl menor movimiento de tu cuerpo al andar\n\nYo a tu lado no siento las horas que van con el tiempo\nNi me acuerdo que llevo en mi pecho una herida mortal\n\nYo contigo no siento el sonar de la lluvia y el viento\nPorque llevo tu amor en mi pecho como un madrigal","favorite":false,"sourceRecordId":"1774045220770","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1781399663635","title":"EL CARRETERO","lyrics":"Por el camino del sitio mío un carretero alegre paso\n\nEn su tonada que es muy sentida, y muy guajira alegre cantó.\n\nMe voy al transbordador a descargar la carreta\nMe voy al transbordador a descargar la carreta\nPara llegar a la meta de mi penosa labor.\n\nYo trabajo sin reposo, para poderme casar, que\nYo trabajo sin reposo para poderme casar\nY si lo puedo lograr seré un guajiro dichoso.","favorite":false,"sourceRecordId":"1781399663635","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1784407923891","title":"SON DE LA LOMA","lyrics":"Mama yo quiero saber\nDe donde son los cantantes\nQue los encuentro muy galantes\nY los quiero conocer\nCon sus trovas fascinantes\nQue me las quiero aprender\n\n\nMama yo quiero saber\nDe donde son los cantantes\nQue los encuentro muy galantes\nY los quiero conocer\nCon sus trovas fascinantes\nQue me las quiero aprender\n\n\nDe donde seran, ay mama\nSeran de La Habana?\nSeran de Santiago...\nTierra soberana?\nSon de la loma\nY cantan en llano\n\nYa veras Tu veras\n\nMama, ellos son de la loma\nMama, ellos cantan en llano","favorite":false,"sourceRecordId":"1784407923891","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1784408159200","title":"EL PROVINCIANO","lyrics":"Las locas ilusiones me sacaron de mi pueblo\nAbandoné mi casa para ver la capital\n\nCómo recuerdo el día feliz de mi partida\nSin reparar en nada de mi tierra me alejé\n\nY mientras que mi madre muy triste y sollozando\nDecíame: \"Hijo mío, llévate mi bendición\"\n\n\nAhora que conozco la ciudad de mi adorado sueño\nY veo realizada la ambición que en mi querer forjé\nEs cuando el desengaño de esta vida me entristece\nY añoro con dolor mi dulce hogar\n\nLuché como varón para vencer y pude conseguirlo\nAlcanzando el anhelo de vivir con todo su esplendor\nEn medio de esta dicha me atormenta la nostalgia\nDel pueblo en que dejé mi corazón\n\n\nAhora que conozco la ciudad de mi adorado sueño\nY veo realizada la ambición que en mi querer forjé\nEs cuando el desengaño de esta vida me entristece\nY añoro con dolor mi dulce hogar","favorite":false,"sourceRecordId":"1784408159200","formatting":{"titleBold":true,"titleHighlighted":true}},{"id":"song-1787350393771","title":"A UNOS OJOS","lyrics":"Tus ojos que contemplo con delicia\nTienen el mismo brillo de la aurora\nTienen la suavidad de la caricia\nY la dulce mirada que enamora\nAy, y la dulce mirada que enamora\n\n\nY por eso yo los adoro\nY hasta el fondo del alma me embeleso\nSaben llorar de pena cuando lloro\nY se llenan de amor cuando los beso\nAy, y se llenan de amor cuando los beso\n\n\nTus ojos de mirar adormecidos\nTienen la placidez del agua en calma\nY muestran en su fondo cristalino\nLa divina pureza de tu alma\nAy, la divina pureza de tu alma\n\n\nY por eso yo los adoro\nY hasta el fondo del alma me embeleso\nSaben llorar de pena cuando lloro\nY se llenan de amor cuando los beso\nAy, y se llenan de amor cuando los beso\n\n\nRecuerda que mi vida está en tus ojos\nEllos son mi alegría y amargura\nEllos me hacen sufrir con sus enojos\nY me vuelven la paz con su ternura\nAy, y me vuelven la paz con su ternura\n\n\nY por eso yo los adoro\nY hasta el fondo del alma me embeleso\nSaben llorar de pena cuando lloro\nY se llenan de amor cuando los beso\nAy, y se llenan de amor cuando los beso","favorite":false,"sourceRecordId":"1787350393771","formatting":{"titleBold":true,"titleHighlighted":true}}],"lists":[{"id":"imported-list-1674257534014","name":"Lista importada 01","color":"#C5CFC","items":[{"text":"Mi bendición","songIds":["1663428283879"]},{"text":"Siempre en mi mente","songIds":[]},{"text":"Piel canela","songIds":["1758416514006"]},{"text":"Así fue","songIds":["1657837682564"]},{"text":"Te he prometido","songIds":["1652573078579","1658013370878"]},{"text":"Hoy voy a verte de nuevo","songIds":["1657905444695","1711240159897"]},{"text":"Carretero","songIds":[]},{"text":"Pedacito de mi vida","songIds":["1767137961701"]},{"text":"La piragua","songIds":["1660402742388","1657934526997"]},{"text":"La tierra del olvido","songIds":["1653833526407","1658082828444"]},{"text":"Tierra del olvido","songIds":[]},{"text":"La cinta rosa","songIds":["1652634936435","1758423985488"]},{"text":"Hasta la raíz","songIds":["1660402824476","1675617493103","1657836895549"]},{"text":"Cama y mesa","songIds":["1656248171911"]},{"text":"Lloraras","songIds":["1684014677664"]},{"text":"Bailar contigo","songIds":["1653834296645","1658543380035","1724190927288"]},{"text":"El pescador","songIds":[]},{"text":"Historia de un amor","songIds":["1674257828626"]},{"text":"El arroyito","songIds":["1669512387874"]},{"text":"Como te hago entender","songIds":["1657837310562"]},{"text":"Quiza","songIds":["1657837430781"]}],"sourceRecordId":"1674257534014","needsReview":true},{"id":"imported-list-1687460152990","name":"Lista importada 02 <script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='cancionero_v1';
const PALETTE=['#E76F51','#2A9D8F','#D98E04','#6C63FF','#E5568F','#3A86FF','#52B788','#9C46AA'];
const hexOK=c=>/^#[0-9a-f]{6}$/i.test(c||'');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ ]+/g,' ').replace(/\s+/g,' ').trim();
let S,V={view:'lists',q:'',fav:false,ctx:null,draft:null,listId:null,songId:null};
let memStore=null;
function loadStore(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return memStore}
function save(){memStore=JSON.parse(JSON.stringify(S));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mkSong(s){return{id:s.id,title:s.title||'',lyrics:s.lyrics||'',favorite:!!s.favorite,sourceRecordId:s.sourceRecordId||null,formatting:Object.assign({titleBold:true,titleHighlighted:true,spans:[]},s.formatting||{})}}
function resolveIds(ids,songs){const out=[];(ids||[]).forEach(x=>{const f=songs.find(s=>s.id===x||s.id==='song-'+x||s.sourceRecordId===x);if(f&&!out.includes(f.id))out.push(f.id)});return out}
function mkList(l,songs,i){return{id:l.id,name:l.name||'Lista',color:hexOK(l.color)?l.color:PALETTE[i%PALETTE.length],needsReview:!!l.needsReview,sourceRecordId:l.sourceRecordId||null,items:(l.items||[]).map(it=>({text:it.text||'',songIds:resolveIds(it.songIds,songs)}))}}
function init(){
 const seed=JSON.parse($('#seed').textContent);
 const songs=seed.songs.map(mkSong);
 S={songs,lists:seed.lists.map((l,i)=>mkList(l,songs,i)),reviewQueue:(seed.reviewQueue||[]).map(r=>({id:r.sourceRecordId,content:r.content||'',reason:r.reason||''})),trash:[],settings:{theme:'auto',accent:'#6c63ff',fontSize:24}};
}
S=loadStore();if(!S)init();save();
const uid=p=>p+'-'+Date.now()+Math.floor(Math.random()*1000);
const songById=id=>S.songs.find(s=>s.id===id);
const listById=id=>S.lists.find(l=>l.id===id);
const firstLine=s=>(s.lyrics||'').split('\n').find(x=>x.trim())||'';

// ---------- rich text (formato sin alterar el texto) ----------
function styleAt(spans,i){const st={};for(const sp of spans){if(i>=sp.s&&i<sp.e){for(const k of ['bold','size','color','tcase']){if(k in sp)st[k]=sp[k]}}}return st}
function css(st){let c='';if(st.bold)c+='font-weight:800;';if(st.size)c+='font-size:'+st.size+'em;';if(st.color)c+='color:'+st.color+';';if(st.tcase==='upper')c+='text-transform:uppercase;';if(st.tcase==='lower')c+='text-transform:lowercase;';return c}
function rich(text,spans){
 if(!spans||!spans.length)return esc(text);
 let out='',cur=null,buf='';
 for(let i=0;i<text.length;i++){const c=css(styleAt(spans,i));if(c!==cur){if(buf)out+=cur?`<span style="${cur}">${esc(buf)}</span>`:esc(buf);buf='';cur=c}buf+=text[i]}
 if(buf)out+=cur?`<span style="${cur}">${esc(buf)}</span>`:esc(buf);
 return out;
}
function shiftSpans(a,b,spans){
 let p=0;while(p<a.length&&p<b.length&&a[p]===b[p])p++;
 let s=0;while(s<a.length-p&&s<b.length-p&&a[a.length-1-s]===b[b.length-1-s])s++;
 const oldEnd=a.length-s,delta=b.length-a.length;
 const out=[];
 for(const sp of spans){
  if(sp.e<=p){out.push(sp)}
  else if(sp.s>=oldEnd){out.push(Object.assign({},sp,{s:sp.s+delta,e:sp.e+delta}))}
  else{const ns=Math.min(sp.s,p),ne=sp.e>oldEnd?sp.e+delta:p+Math.max(0,b.length-s-p);if(ne>ns)out.push(Object.assign({},sp,{s:ns,e:ne}))}
 }
 return out;
}

// ---------- UI helpers ----------
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(title,body,actions){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="md"><h3>${esc(title)}</h3><div class="mb">${body||''}</div><div class="row" style="margin-top:14px;justify-content:flex-end" id="ma"></div></div>`;
 document.body.appendChild(o);
 const close=()=>o.remove();
 (actions||[]).forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'alt');b.textContent=a.label;b.onclick=()=>{if(a.fn)a.fn(o,close);if(!a.keep)close()};o.querySelector('#ma').appendChild(b)});
 o.addEventListener('click',e=>{if(e.target===o)close()});
 return{el:o,close};
}
function confirmBox(msg,ok,label){modal('Confirmar',`<p>${esc(msg)}</p>`,[{label:'Cancelar'},{label:label||'Aceptar',cls:'danger',fn:ok}])}
function pickSong(cb){
 const m=modal('Elegir canción',`<input type="search" id="pq" placeholder="Buscar canción…"><div id="pl"></div>`,[{label:'Cerrar'}]);
 const draw=()=>{const q=norm(m.el.querySelector('#pq').value);const arr=S.songs.filter(s=>!q||norm(s.title).includes(q)).sort((a,b)=>a.title.localeCompare(b.title,'es')).slice(0,60);
  m.el.querySelector('#pl').innerHTML=arr.map(s=>`<div class="item" data-pick="${s.id}"><div class="t"><b>${esc(s.title)}</b><small>${esc(firstLine(s))}</small></div></div>`).join('')||'<p class="muted">Sin resultados</p>'};
 m.el.querySelector('#pq').oninput=draw;draw();
 m.el.querySelector('#pl').onclick=e=>{const it=e.target.closest('[data-pick]');if(it){m.close();cb(it.dataset.pick)}};
}
function trash(kind,item){S.trash.unshift({kind,item,at:Date.now()})}

// ---------- vistas ----------
function setTheme(){if(S.settings.theme==='light'||S.settings.theme==='dark')document.documentElement.dataset.theme=S.settings.theme;else delete document.documentElement.dataset.theme;document.documentElement.style.setProperty('--accent',S.settings.accent)}
function navHtml(){
 const t=[['lists','📚','Listas'],['songs','🎵','Canciones'],['review','📝','Revisión'],['settings','⚙️','Ajustes']];
 const cur=({listDetail:'lists',editList:'lists',reader:V.from||'lists',editSong:'songs'})[V.view]||V.view;
 return t.map(([k,i,l])=>`<button class="${cur===k?'on':''}" data-act="nav" data-v="${k}"><b>${i}</b>${l}${k==='review'&&S.reviewQueue.length?`<span class="badge">${S.reviewQueue.length}</span>`:''}</button>`).join('');
}
function render(){
 setTheme();stopAuto();
 const ctl=document.querySelector('.ctl');if(ctl)ctl.remove();
 const v=V.view,app=$('#app');let title='Cancionero',back=false,hx='';
 if(v==='lists'){title='Listas';hx='<button data-act="newList">＋ Nueva</button>';app.innerHTML=listsView()}
 else if(v==='listDetail'){const l=listById(V.listId);title=l.name;back=true;hx='<button data-act="editList">✎</button>';app.innerHTML=listDetail(l)}
 else if(v==='editList'){title='Editar lista';back=true;app.innerHTML=editListView()}
 else if(v==='songs'){title='Canciones';hx='<button data-act="newSong">＋ Nueva</button>';app.innerHTML=songsView();drawSongs()}
 else if(v==='reader'){const s=songById(V.songId);title=s.title;back=true;hx='<button data-act="editSong" data-id="'+s.id+'">✎</button>';app.innerHTML=readerView(s);readerControls()}
 else if(v==='editSong'){title=V.draft.id?'Editar canción':'Nueva canción';back=true;app.innerHTML=editSongView();drawPrev()}
 else if(v==='review'){title='Revisión de notas';app.innerHTML=reviewView()}
 else if(v==='settings'){title='Ajustes';app.innerHTML=settingsView()}
 else if(v==='trash'){title='Papelera';back=true;app.innerHTML=trashView()}
 $('#ttl').textContent=title;$('#back').style.display=back?'':'none';$('#hx').innerHTML=hx;
 $('#nav').innerHTML=navHtml();
 if(v!=='reader')window.scrollTo(0,0);
}
function listsView(){
 if(!S.lists.length)return '<p class="muted">Aún no hay listas. Toca “＋ Nueva”.</p>';
 const rev=S.lists.filter(l=>l.needsReview).length;
 return (rev?`<p class="muted">${rev} listas importadas esperan que les pongas nombre (toca una y luego ✎).</p>`:'')+`<div class="lists">${S.lists.map(l=>`<div class="lcard" style="background:${l.color}" data-act="openList" data-id="${l.id}"><h3>${esc(l.name)}</h3><small>${l.items.length} canciones${l.needsReview?' · sin nombrar':''}</small></div>`).join('')}</div>`;
}
function listDetail(l){
 const rows=l.items.map((it,i)=>{const s=songById(it.songIds[0]);
  return `<div class="item" style="border-left:6px solid ${l.color}"><div class="t" data-act="${s?'openFromList':'linkItem'}" data-i="${i}"><b>${esc(s?s.title:it.text)}</b><small>${s?(it.songIds.length>1?it.songIds.length+' versiones · ':'')+esc(firstLine(s)):'<span class="warn">Sin letra enlazada — toca para enlazar</span>'}</small></div><button class="ib" data-act="mv" data-i="${i}" data-d="-1">▲</button><button class="ib" data-act="mv" data-i="${i}" data-d="1">▼</button><button class="ib" data-act="rmItem" data-i="${i}">✕</button></div>`}).join('');
 return `<div class="row" style="margin-bottom:8px"><button class="btn" data-act="addToList">＋ Añadir canción</button></div>${rows||'<p class="muted">Lista vacía.</p>'}`;
}
function editListView(){
 const d=V.draft;
 return `<label>Nombre</label><input type="text" id="ln" value="${esc(d.name)}"><p>Color</p><div class="sw">${PALETTE.map(c=>`<i data-act="pickColor" data-c="${c}" class="${d.color===c?'on':''}" style="background:${c}"></i>`).join('')}<input type="color" id="lcol" value="${hexOK(d.color)?d.color:'#6c63ff'}" style="width:44px;height:44px;padding:2px"></div>
 <div class="row" style="margin-top:14px"><button class="btn" data-act="saveList">Guardar</button>${d.isNew?'':'<button class="btn danger" data-act="delList">Borrar lista</button>'}</div>`;
}
function songsView(){
 return `<div class="row"><div class="grow"><input type="search" id="sq" placeholder="Buscar por título o letra…" value="${esc(V.q)}"></div><button class="btn sm ${V.fav?'':'alt'}" data-act="togFav">★ Favoritas</button></div><p class="muted" id="cnt"></p><div id="sl"></div>`;
}
function drawSongs(){
 const q=norm(V.q);
 const arr=S.songs.filter(s=>(!V.fav||s.favorite)&&(!q||norm(s.title).includes(q)||norm(s.lyrics).includes(q))).sort((a,b)=>a.title.localeCompare(b.title,'es'));
 $('#cnt').textContent=arr.length+' de '+S.songs.length+' canciones';
 $('#sl').innerHTML=arr.slice(0,150).map(s=>`<div class="item"><div class="t" data-act="openSong" data-id="${s.id}"><b>${esc(s.title)}</b><small>${esc(firstLine(s))}</small></div><button class="ib fav" data-act="fav" data-id="${s.id}">${s.favorite?'★':'☆'}</button><button class="ib" data-act="editSong" data-id="${s.id}">✎</button><button class="ib" data-act="delSong" data-id="${s.id}">🗑</button></div>`).join('')+(arr.length>150?'<p class="muted">Mostrando 150; afina la búsqueda.</p>':'');
}
function readerView(s){
 const f=s.formatting||{};
 return `<div class="reader-title ${f.titleHighlighted?'hl':''}" style="${f.titleBold?'font-weight:800':'font-weight:500'}">${esc(s.title)}</div><div class="lyrics" id="lyr" style="font-size:${S.settings.fontSize}px">${rich(s.lyrics,f.spans)}</div>`;
}
function readerControls(){
 const c=document.createElement('div');c.className='ctl';
 const hasCtx=V.ctx&&listById(V.ctx.listId);
 c.innerHTML=`<button data-hold="-1" title="Subir">▲</button><button id="autoBtn" data-act="auto">▶ Auto: apagado</button><button data-hold="1" title="Bajar">▼</button><button class="s" data-act="fs" data-d="-2">A−</button><button class="s" data-act="fs" data-d="2">A+</button>${hasCtx?'<button class="s" data-act="prevS">‹</button><button class="s" data-act="nextS">›</button>':''}`;

 <label>Letra</label>

 return `<p class="muted">Notas sin título del archivo original. Decide qué hacer con cada una; nada se descarta sin confirmar.</p>`+S.reviewQueue.map(r=>`<div class="sec"><div class="note">${esc(r.content.slice(0,600)||'(vacía)')}${r.content.length>600?'…':''}</div><div class="row"><button class="btn sm" data-act="rvSong" data-id="${r.id}">→ Canción</button><button class="btn sm" data-act="rvList" data-id="${r.id}">→ Lista</button><button class="btn sm alt" data-act="rvDrop" data-id="${r.id}">Descartar</button></div></div>`).join('');

function settingsView(){
 const st=S.settings;
 return `<div class="sec"><h3>Apariencia</h3><div class="row"><select id="thm" style="width:auto"><option value="auto" ${st.theme==='auto'?'selected':''}>Tema del dispositivo</option><option value="light" ${st.theme==='light'?'selected':''}>Tema claro</option><option value="dark" ${st.theme==='dark'?'selected':''}>Tema oscuro</option></select><label>Color principal <input type="color" id="acc" value="${st.accent}" style="width:50px;height:40px;padding:2px;vertical-align:middle"></label></div></div>
 <div class="sec"><h3>Copia de seguridad (JSON)</h3><p class="muted">Todo se guarda automáticamente en este navegador. Toca “Copiar copia JSON” y pégalo en un archivo de notas o correo. Para restaurar, usa “Cargar copia (.json)” y elige ese archivo.</p><div class="row"><button class="btn" data-act="export">Descargar copia</button><button class="btn alt" data-act="copyJson">Copiar JSON</button><button class="btn alt" data-act="importBtn">Cargar copia (.json)</button></div><input type="file" id="imp" accept=".json,application/json" style="display:none"></div>

function trashView(){
 if(!S.trash.length)return '<p class="muted">La papelera está vacía.</p>';
 return S.trash.map((t,i)=>`<div class="item"><div class="t"><b>${esc(t.kind==='song'?t.item.title:t.item.name)}</b><small>${t.kind==='song'?'Canción':'Lista'}</small></div><button class="btn sm" data-act="restore" data-i="${i}">Recuperar</button><button class="btn sm danger" data-act="purge" data-i="${i}">Eliminar</button></div>`).join('');
}

// ---------- autoscroll ----------
let auto=0,raf=0,last=0,acc=0,manual=0;
const SPEEDS=[0,28,60,115],NAMES=['apagado','lento','medio','rápido'];
function loop(t){const dt=Math.min(0.1,(t-last)/1000);last=t;const v=manual?manual*240:SPEEDS[auto];if(v){acc+=v*dt;const d=Math.trunc(acc);if(d){const el=document.scrollingElement||document.documentElement;el.scrollTop+=d;acc-=d}}raf=requestAnimationFrame(loop)}
function runLoop(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}
function stopAuto(){auto=0;manual=0;cancelAnimationFrame(raf);raf=0;acc=0}
function updAuto(){const b=$('#autoBtn');if(!b)return;b.textContent=(auto?'⏸ Auto: ':'▶ Auto: ')+NAMES[auto];b.classList.toggle('run',!!auto)}
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-hold]');if(h){e.preventDefault();manual=+h.dataset.hold;runLoop()}});
['pointerup','pointercancel','blur'].forEach(ev=>window.addEventListener(ev,()=>{manual=0;if(!auto){cancelAnimationFrame(raf);raf=0}}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-hold]'))e.preventDefault()});

// ---------- acciones ----------
function go(v,extra){Object.assign(V,extra||{});V.view=v;render()}
function openSong(id,ctx,from){V.songId=id;V.ctx=ctx||null;V.from=from||'songs';go('reader')}
function newDraftSong(){return{id:null,title:'',lyrics:'',favorite:false,formatting:{titleBold:true,titleHighlighted:true,spans:[]}}}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act],[data-fmt]');if(!el)return;
 if(el.dataset.fmt){return fmt(el.dataset.fmt)}
 const a=el.dataset.act,d=el.dataset;
 switch(a){
  case 'nav':V.ctx=null;go(d.v);break;
  case 'back':
   if(V.view==='reader')go(V.ctx?'listDetail':'songs',V.ctx?{listId:V.ctx.listId}:{});
   else if(V.view==='editSong')go(V.songId&&V.fromReader?'reader':'songs');
   else if(V.view==='editList')go(V.draft.isNew?'lists':'listDetail');
   else if(V.view==='listDetail')go('lists');
   else if(V.view==='trash')go('settings');
   break;
  case 'newList':V.draft={isNew:true,id:uid('list'),name:'',color:PALETTE[S.lists.length%PALETTE.length],items:[]};go('editList');break;
  case 'openList':go('listDetail',{listId:d.id});break;
  case 'editList':{const l=listById(V.listId);V.draft=JSON.parse(JSON.stringify(l));go('editList');break}
  case 'pickColor':V.draft.name=$('#ln').value;V.draft.color=d.c;render();break;
  case 'saveList':{
   V.draft.name=$('#ln').value.trim();if(!V.draft.name)return toast('Ponle un nombre a la lista');
   const col=$('#lcol').value;if(!PALETTE.includes(V.draft.color)&&!V.draft.colorChosen)V.draft.color=col;
   if(V.draft.isNew){delete V.draft.isNew;S.lists.push(V.draft)}else{const i=S.lists.findIndex(x=>x.id===V.draft.id);V.draft.needsReview=false;S.lists[i]=V.draft}
   save();go('listDetail',{listId:V.draft.id});break}
  case 'delList':confirmBox('¿Mover la lista “'+V.draft.name+'” a la papelera? Las canciones no se borran.',()=>{const i=S.lists.findIndex(x=>x.id===V.draft.id);trash('list',S.lists[i]);S.lists.splice(i,1);save();go('lists');toast('Lista en papelera')},'Borrar');break;
  case 'addToList':pickSong(id=>{const l=listById(V.listId);if(l.items.some(it=>it.songIds.includes(id)))return toast('Esa canción ya está en la lista');l.items.push({text:songById(id).title,songIds:[id]});save();render()});break;
  case 'linkItem':{const i=+d.i;pickSong(id=>{const l=listById(V.listId);const it=l.items[i];if(l.items.some((x,j)=>j!==i&&x.songIds.includes(id)))toast('Ojo: esa canción ya estaba en la lista');it.songIds=[id];save();render()});break}
  case 'openFromList':{const l=listById(V.listId);openSong(l.items[+d.i].songIds[0],{listId:l.id,idx:+d.i},'lists');break}
  case 'mv':{const l=listById(V.listId),i=+d.i,j=i+ +d.d;if(j<0||j>=l.items.length)break;[l.items[i],l.items[j]]=[l.items[j],l.items[i]];save();render();break}
  case 'rmItem':{const l=listById(V.listId),i=+d.i;confirmBox('¿Quitar “'+l.items[i].text+'” de esta lista? (La canción se conserva.)',()=>{l.items.splice(i,1);save();render()},'Quitar');break}
  case 'togFav':V.fav=!V.fav;render();break;
  case 'fav':{const s=songById(d.id);s.favorite=!s.favorite;save();drawSongs();break}
  case 'openSong':openSong(d.id,null,'songs');break;
  case 'newSong':V.draft=newDraftSong();V.fromReader=false;go('editSong');break;
  case 'editSong':{const s=songById(d.id);V.draft=JSON.parse(JSON.stringify(s));V.draft.formatting.spans=V.draft.formatting.spans||[];V.songId=s.id;V.fromReader=V.view==='reader';go('editSong');break}
  case 'saveSong':{
   const dr=V.draft;dr.title=$('#st').value.trim();dr.lyrics=$('#sly').value;dr.formatting.titleBold=$('#tb').checked;dr.formatting.titleHighlighted=$('#th').checked;
   if(!dr.title)return toast('El título no puede estar vacío');
   if(dr.id){const i=S.songs.findIndex(x=>x.id===dr.id);dr.sourceRecordId=S.songs[i].sourceRecordId;S.songs[i]=dr}
   else{dr.id=uid('song');S.songs.push(dr);if(dr.fromReview){S.reviewQueue=S.reviewQueue.filter(r=>r.id!==dr.fromReview);delete dr.fromReview}}
   save();toast('Guardado');V.songId=dr.id;go(V.fromReader?'reader':'songs');break}
  case 'delSong':{const s=songById(d.id);confirmBox('¿Mover “'+s.title+'” a la papelera? Podrás recuperarla.',()=>{trash('song',s);S.songs=S.songs.filter(x=>x.id!==s.id);save();drawSongs();toast('Canción en papelera')},'Borrar');break}
  case 'auto':auto=(auto+1)%4;if(auto)runLoop();else if(!manual){cancelAnimationFrame(raf);raf=0}updAuto();break;
  case 'fs':S.settings.fontSize=Math.max(14,Math.min(54,S.settings.fontSize+ +d.d*2));save();$('#lyr').style.fontSize=S.settings.fontSize+'px';break;
  case 'prevS':case 'nextS':{const l=listById(V.ctx.listId);let i=V.ctx.idx+(a==='nextS'?1:-1);while(i>=0&&i<l.items.length&&!songById(l.items[i].songIds[0]))i+=(a==='nextS'?1:-1);if(i<0||i>=l.items.length)return toast(a==='nextS'?'Es la última':'Es la primera');V.ctx.idx=i;V.songId=l.items[i].songIds[0];render();break}
  case 'rvSong':{const r=S.reviewQueue.find(x=>x.id===d.id);V.draft=Object.assign(newDraftSong(),{lyrics:r.content,fromReview:r.id});V.fromReader=false;go('editSong');break}
  case 'rvList':{const r=S.reviewQueue.find(x=>x.id===d.id);const lines=r.content.split('\n').map(x=>x.trim()).filter(Boolean);
   const items=lines.map(t=>{const f=S.songs.find(s=>norm(s.title)===norm(t));return{text:t,songIds:f?[f.id]:[]}});
   confirmBox('Se creará una lista con '+lines.length+' líneas y se quitará esta nota de la revisión.',()=>{const l={id:uid('list'),name:'Lista nueva (de nota)',color:PALETTE[S.lists.length%PALETTE.length],needsReview:true,items};S.lists.push(l);S.reviewQueue=S.reviewQueue.filter(x=>x.id!==r.id);save();go('listDetail',{listId:l.id})},'Crear lista');break}
  case 'rvDrop':confirmBox('¿Descartar esta nota? Se perderá su contenido.',()=>{S.reviewQueue=S.reviewQueue.filter(x=>x.id!==d.id);save();render()},'Descartar');break;
  case 'openTrash':go('trash');break;
  case 'restore':{const t=S.trash.splice(+d.i,1)[0];(t.kind==='song'?S.songs:S.lists).push(t.item);save();render();toast('Recuperado');break}
  case 'purge':confirmBox('¿Eliminar definitivamente? No se puede deshacer.',()=>{S.trash.splice(+d.i,1);save();render()},'Eliminar');break;
    case 'export':doExport();break;
  case 'driveSave':driveSave();break;
  case 'driveLoad':driveLoad();break;
  case 'copyJson':try{navigator.clipboard.writeText(JSON.stringify(exportObj(),null,1)).then(()=>toast('JSON copiado'),()=>toast('No se pudo copiar'))}catch(x){toast('No se pudo copiar')}break;
  case 'importBtn':$('#imp').click();break;
 }
});

 if(t.id==='sq'){V.q=t.value;drawSongs()}

 if(t.id==='lcol'){V.draft.color=t.value;V.draft.name=$('#ln').value;V.draft.colorChosen=true;document.querySelectorAll('.sw i').forEach(i=>i.classList.remove('on'))}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='gcid'){S.settings.driveClientId=t.value.trim();save()}
 if(t.id==='thm'){S.settings.theme=t.value;save();setTheme()}
 if(t.id==='acc'){S.settings.accent=t.value;save();setTheme()}
 if(t.id==='fsz'&&t.value){applyFmt({size:+t.value});t.value=''}

document.addEventListener('mousedown',e=>{if(e.target.closest('.tb button'))e.preventDefault()});
function applyFmt(patch){
 const ta=$('#sly');if(!ta)return;const s=ta.selectionStart,e2=ta.selectionEnd;
 if(s===e2)return toast('Selecciona primero un fragmento de la letra');
 V.draft.formatting.spans.push(Object.assign({s,e:e2},patch));drawPrev();
}
function fmt(k){
 const ta=$('#sly');const s=ta.selectionStart,e2=ta.selectionEnd;
 if(s===e2)return toast('Selecciona primero un fragmento de la letra');
 const sp=V.draft.formatting.spans;
 if(k==='upper')applyFmt({tcase:'upper'});
 else if(k==='lower')applyFmt({tcase:'lower'});
 else if(k==='bold'){const cur=styleAt(sp,s).bold;applyFmt({bold:!cur})}
 else if(k==='clear'){
  const out=[];for(const x of sp){if(x.e<=s||x.s>=e2){out.push(x)}else{if(x.s<s)out.push(Object.assign({},x,{e:s}));if(x.e>e2)out.push(Object.assign({},x,{s:e2}))}}
  V.draft.formatting.spans=out;drawPrev();
 }
}
function exportObj(){return{schemaVersion:'1.0.0',app:'Cancionero',exportedAt:new Date().toISOString(),songs:S.songs,lists:S.lists,reviewQueue:S.reviewQueue.map(r=>({sourceRecordId:r.id,content:r.content,reason:r.reason})),trash:S.trash,settings:S.settings}}
function doExport(){try{const b=new Blob([JSON.stringify(exportObj(),null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="cancionero_copia_"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();toast("Copia descargada")}catch(x){toast("No se pudo descargar; usa Copiar JSON")}}
function applyBackup(o,mode){
 const inSongs=(o.songs||[]).map(mkSong);
 if(mode==='replace'){
  S.songs=inSongs;
  S.lists=(o.lists||[]).map((l,i)=>mkList(l,S.songs,i));
  S.reviewQueue=(o.reviewQueue||[]).map(r=>({id:r.sourceRecordId||r.id,content:r.content||'',reason:r.reason||''}));
  S.trash=Array.isArray(o.trash)?o.trash:[];
  if(o.settings){S.settings=Object.assign({},S.settings,o.settings,{driveClientId:S.settings.driveClientId,driveLast:S.settings.driveLast})}
 }else{
  inSongs.forEach(s=>{if(!S.songs.some(x=>x.id===s.id))S.songs.push(s)});
  (o.lists||[]).forEach((l,i)=>{if(!S.lists.some(x=>x.id===l.id))S.lists.push(mkList(l,S.songs,i))});
  (o.reviewQueue||[]).forEach(r=>{const id=r.sourceRecordId||r.id;if(!S.reviewQueue.some(x=>x.id===id))S.reviewQueue.push({id,content:r.content||'',reason:r.reason||''})});
 }
 save();go('lists');toast('Copia cargada: '+S.songs.length+' canciones, '+S.lists.length+' listas');
}
function askRestore(o,origin){
 const ns=(o.songs||[]).length,nl=(o.lists||[]).length;
 if(!ns&&!nl)return toast('El archivo no contiene canciones ni listas');
 modal('Cargar copia'+(origin?' ('+origin+')':''),`<p>Se encontraron <b>${ns}</b> canciones y <b>${nl}</b> listas.</p><p class="muted">“Cargar todo” deja la app exactamente como en la copia (reemplaza lo actual). “Solo añadir” suma lo que falte sin tocar lo que ya tienes.</p>`,[
  {label:'Cancelar'},
  {label:'Solo añadir',fn:()=>applyBackup(o,'merge')},
  {label:'Cargar todo',cls:'',fn:()=>applyBackup(o,'replace')}
 ]);
}
function doImport(txt){
 let o;try{o=JSON.parse(txt)}catch(x){return toast('Archivo JSON no válido')}
 askRestore(o,'');
}
// ---------- Google Drive (OAuth oficial, carpeta privada de la app) ----------
const DRIVE_FILE='cancionero_copia.json';
let gsiLoading=null,gToken=null,gTokenExp=0;
function dstat(m){const e=$('#dst');if(e)e.textContent=m}
function loadGsi(){
 if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
 if(gsiLoading)return gsiLoading;
 gsiLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>{gsiLoading=null;rej(new Error('No se pudo cargar el inicio de sesión de Google. Revisa tu conexión.'))};document.head.appendChild(s)});
 return gsiLoading;
}
async function getToken(){
 if(gToken&&Date.now()<gTokenExp)return gToken;
 const cid=(S.settings.driveClientId||'').trim();
 if(!cid)throw new Error('Primero pega tu ID de cliente de Google.');
 if(location.protocol!=='https:'&&location.hostname!=='localhost')throw new Error('Google Drive solo funciona con la app abierta desde una dirección https (publicada), no desde un archivo local.');
 await loadGsi();
 return new Promise((res,rej)=>{
  const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.error)return rej(new Error('Google rechazó el acceso: '+r.error));gToken=r.access_token;gTokenExp=Date.now()+(r.expires_in-60)*1000;res(gToken)},error_callback:e=>rej(new Error('No se completó el inicio de sesión.'))});
  tc.requestAccessToken({prompt:gToken?'':'consent'});
 });
}
async function dfetch(url,opt){
 const tk=await getToken();
 const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+tk},(opt&&opt.headers)||{})}));
 if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(x){}throw new Error('Drive respondió '+r.status+(m?': '+m:''))}
 return r;
}
async function findBackup(){
 const q=encodeURIComponent("name='"+DRIVE_FILE+"'");
 const r=await dfetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+q+'&fields=files(id,modifiedTime)&orderBy=modifiedTime desc');
 const j=await r.json();return (j.files||[])[0]||null;
}
async function driveSave(){
 try{
  dstat('Conectando con Google…');
  const body=JSON.stringify(exportObj());
  const f=await findBackup();
  if(f){await dfetch('https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body})}
  else{
   const bd='cancionero'+Date.now();
   const meta=JSON.stringify({name:DRIVE_FILE,parents:['appDataFolder']});
   const mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--';
   await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp});
  }
  S.settings.driveLast=new Date().toLocaleString('es');save();
  dstat('Última copia en Drive: '+S.settings.driveLast);toast('Copia guardada en Drive');
 }catch(e){dstat(e.message||'Error al guardar en Drive');toast('No se pudo guardar en Drive')}
}
async function driveLoad(){
 try{
  dstat('Buscando tu copia en Drive…');
  const f=await findBackup();
  if(!f){dstat('Aún no hay copia en tu Drive.');return toast('No hay copia en Drive')}
  const r=await dfetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media');
  const o=await r.json();dstat('');
  askRestore(o,'Drive, '+new Date(f.modifiedTime).toLocaleString('es'));
 }catch(e){dstat(e.message||'Error al leer Drive');toast('No se pudo leer de Drive')}
}
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
